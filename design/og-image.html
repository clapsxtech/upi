<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
 background:radial-gradient(900px 500px at 85% 20%,#ccfbf1 0%,#f8fafc 55%);display:flex;overflow:hidden;position:relative}
.left{padding:72px 0 64px 80px;display:flex;flex-direction:column;width:720px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:72px;height:72px}
.brand span{font-size:34px;font-weight:700;color:#134e4a;letter-spacing:-.5px}
h1{margin-top:56px;font-size:76px;line-height:1.02;font-weight:800;color:#0f172a;letter-spacing:-2.5px}
h1 em{font-style:normal;color:#0d9488}
p{margin-top:24px;font-size:28px;color:#475569;line-height:1.35}
.apps{margin-top:auto;display:flex;align-items:center;gap:34px}
.apps img{height:38px}
.card{position:absolute;right:80px;top:95px;width:340px;height:440px;border-radius:32px;
 background:linear-gradient(150deg,#0d9488,#115e59);box-shadow:0 30px 60px -20px rgba(19,78,74,.45);
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:20px}
.card .mark{width:120px;height:120px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center}
.card .mark img{width:86px}
.card .lbl{font-size:20px;letter-spacing:3px;text-transform:uppercase;color:#99f6e4}
.card .upi{background:#fff;border-radius:14px;padding:12px 22px}
.card .upi img{height:40px;display:block}
.card .sec{font-size:19px;color:#ccfbf1}
</style></head><body>
<div class="left">
  <div class="brand"><img src="../assets/claps-mark.png"><span>Claps Learn</span></div>
  <h1>Pay your tuition<br>fees <em>via UPI</em></h1>
  <p>Pay in one tap with any UPI app.<br>Direct bank-to-bank transfer.</p>
  <div class="apps">
    <img src="../assets/gpay.svg"><img src="../assets/phonepe.svg"><img src="../assets/paytm.svg"><img src="../assets/bhim.svg">
  </div>
</div>
<div class="card">
  <div class="mark"><img src="../assets/claps-mark.png"></div>
  <div class="lbl">Secure payment</div>
  <div class="upi"><img src="../assets/upi.svg"></div>
  <div class="sec">Official Claps Learn payment</div>
</div>
</body></html>
